name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: Frontend — typecheck + tests + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc -b

      - name: Run unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          VITE_SENTRY_DSN: https://public@o0.ingest.sentry.io/0
          VITE_POSTHOG_KEY: phc_ci_placeholder

      - name: Bundle-size budget
        run: node scripts/bundle-budget.mjs

  e2e:
    name: Frontend — Playwright end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Public pages only need a syntactically valid Supabase config. The
      # signed-in flow runs when the E2E_* secrets point at a test project.
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || 'ci-placeholder-key' }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run e2e

      - name: Check the Content-Security-Policy against the production build
        run: npm run build && node scripts/csp-smoke.mjs

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: app/test-results
          retention-days: 7

  ai-service:
    name: AI Service — Node.js smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: node --check server.mjs && node --check groqClient.mjs && node --check chatRequest.mjs

      - name: Unit tests
        run: npm test

  pdf-service:
    name: PDF Service — Node.js smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: node --check server.mjs && node --check render.mjs && node --check export.mjs

      - name: Unit tests
        run: npm test

  database:
    name: Database — migrations + row-level security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations and test policies
        run: npm test

  supabase-stack:
    name: Database — migrations on a real Supabase stack
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Postgres with every migration applied
        run: supabase db start

      - name: Run every migration again
        run: |
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done

      - name: Check the schema is complete
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -c "
            select count(*) from unnest(array['documents','workspaces','comments','notifications','notification_preferences','profiles']) t
            where to_regclass('public.' || t) is null
          " | grep -qx 0
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -c "
            select count(*) from pg_tables where schemaname = 'public' and not rowsecurity
          " | grep -qx 0

      - name: Stop
        if: always()
        run: supabase stop --no-backup
