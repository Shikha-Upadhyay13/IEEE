# Supabase CLI settings for a local stack (`supabase start`) and CI.
# Only what differs from the CLI defaults is listed here.
project_id = "ieee-paper-builder"

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:5173"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
